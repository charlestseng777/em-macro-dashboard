name: Update EM Macro Dashboard

on:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC, every day
  workflow_dispatch:        # manual trigger from the Actions tab
  push:                     # redeploy when the code or countries.json changes
    branches: [main]
    paths-ignore: ['data/**', 'em-macro-dashboard.html']

permissions:
  contents: write   # commit refreshed data
  pages: write      # publish to GitHub Pages
  id-token: write

concurrency:
  group: em-macro-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # fetch_em.py uses only the standard library - nothing to install.
      - name: Fetch fresh data
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}   # optional, Mexico target rate / TIIE
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}     # optional, else public CSV
        run: |
          # Per-source failures keep the previous values and are logged in
          # data/meta.json; the script only exits 1 if every source failed.
          python fetch_em.py || fetch_status=$?
          fetch_status=${fetch_status:-0}
          python build_single.py
          exit $fetch_status

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "em-macro-bot"
          git config user.email "actions@github.com"
          # Commit this run's data on top of the LATEST main, not the commit this
          # run started from: a re-run of an old run, or two overlapping runs,
          # would otherwise conflict on data/*.json. This run's data is the
          # newest, so it simply replaces whatever is there.
          out=$(mktemp -d)
          cp -r data em-macro-dashboard.html "$out"/
          git fetch origin main
          git checkout -f -B main origin/main
          rm -rf data && cp -r "$out"/data . && cp "$out"/em-macro-dashboard.html .
          git add -A data/ em-macro-dashboard.html
          git diff --staged --quiet || git commit -m "EM macro data refresh $(date +%Y-%m-%d)"
          git push origin main

      # Publish from this job: commits pushed with GITHUB_TOKEN don't trigger a
      # "deploy from branch" Pages build, so the site would otherwise go stale.
      # Requires Settings > Pages > Source = "GitHub Actions".
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: .
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
